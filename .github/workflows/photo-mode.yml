name: Photo Mode

on:
  push:
    branches: [main]
    paths:
      - 'photo-mode/**'
      - '.github/workflows/photo-mode.yml'
    tags: ['photo-mode-v*']
  pull_request:
    paths:
      - 'photo-mode/**'
      - '.github/workflows/photo-mode.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: photo-mode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v6
        with:
          name: photo-mode
          path: photo-mode/build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/photo-mode-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Photo Mode ${{ github.ref_name }}
          files: photo-mode/build/libs/*.jar
          generate_release_notes: true
