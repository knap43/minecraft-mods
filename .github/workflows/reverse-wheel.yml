name: Reverse Wheel

on:
  push:
    branches: [main]
    paths:
      - 'reverse-wheel/**'
      - '.github/workflows/reverse-wheel.yml'
    tags: ['reverse-wheel-v*']
  pull_request:
    paths:
      - 'reverse-wheel/**'
      - '.github/workflows/reverse-wheel.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: reverse-wheel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v6
        with:
          name: reverse-wheel
          path: reverse-wheel/build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/reverse-wheel-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Reverse Wheel ${{ github.ref_name }}
          files: reverse-wheel/build/libs/*.jar
          generate_release_notes: true
