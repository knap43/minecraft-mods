name: Help Wanted

on:
  push:
    branches: [main]
    paths:
      - 'help-wanted/**'
      - '.github/workflows/help-wanted.yml'
    tags: ['help-wanted-v*']
  pull_request:
    paths:
      - 'help-wanted/**'
      - '.github/workflows/help-wanted.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: help-wanted

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v6
        with:
          name: help-wanted
          path: help-wanted/build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/help-wanted-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Help Wanted ${{ github.ref_name }}
          files: help-wanted/build/libs/*.jar
          generate_release_notes: true
